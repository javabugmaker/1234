<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TickFlow Pages 发布状态</title><style>body{margin:0;background:#07111f;color:#edf5ff;font:16px system-ui;padding:8vw}a{color:#46d9ff}.card{max-width:880px;background:#0d1b2d;border:1px solid #20364f;border-radius:14px;padding:28px}.step{border-left:3px solid #46d9ff;padding:4px 0 4px 16px;margin:16px 0;color:#b8cbe0}</style></head><body><main class="card"><h1>Pages 发布状态</h1><p>DAILY / WEEKLY 会先原子生成并校验四个核心页面，再把本地 <code>docs/</code> 安全提交到配置的 Git 远端。GUI 的“发布 Pages”可单独重试，CLI 对应 <code>neural-alpha publish-pages</code>。</p><div class="step">1. 本地完整页面与图表校验</div><div class="step">2. 临时 Git index 只叠加 docs/，不改工作区、当前分支或已有暂存内容</div><div class="step">3. 非强制推送 main；远端并发更新会安全失败</div><div class="step">4. CI 通过后由 GitHub Actions 原子部署；失败时保留上一版健康站点</div><p><a href="index.html">首页</a> · <a href="daily.html">日报</a> · <a href="weekly.html">周报</a></p></main></body></html>
