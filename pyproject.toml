[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tickflow-neural-alpha"
version = "0.1.0"
description = "Point-in-time A-share neural alpha research and execution pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
authors = [{name = "javabugmaker"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow>=15,<22",
  "PyYAML>=6.0,<7",
  "matplotlib>=3.8,<4",
  "torch>=2.3,<3",
  "tickflow>=0.1.24,<0.2",
  "httpx[socks]>=0.25,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[project.scripts]
neural-alpha = "neural_a_share.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
